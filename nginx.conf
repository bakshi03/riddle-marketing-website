server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds with format: 'directory' (/uslugi/index.html), so both
    # /uslugi and /uslugi/ resolve without a redirect.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Long-cache hashed build assets (Astro fingerprints these).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache media a bit, but let updates show up reasonably quickly.
    location ~* \.(jpg|jpeg|png|webp|gif|svg|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never cache HTML so redeploys are picked up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;
}
