<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header lang="bg" style="position:sticky;top:0;z-index:50;background:#F3F0E9;border-bottom:1px solid rgba(26,26,23,0.14);font-family:'Sofia Sans',sans-serif;color:#1A1A17">
  <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);height:76px;display:flex;align-items:center;gap:40px;box-sizing:border-box">
    <a href="Home.dc.html" style="display:flex;align-items:baseline;gap:6px;text-decoration:none;color:#1A1A17;font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:-0.01em;white-space:nowrap">Riddle<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}"><span style="font-size:30px">Marketing</span></sc-if></a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:28px;font-size:16px;font-weight:500">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="text-decoration:none;color:#1A1A17;padding:6px 0;border-bottom:2px solid {{ l.line }}">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
      <a href="tel:+359897853219" style="font-weight:700;font-size:17px;text-decoration:none;color:#1A1A17;white-space:nowrap">0897 853 219</a>
      <a href="viber://chat?number=%2B359897853219" style="display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:#1A1A17;text-decoration:none"><img src="https://www.viber.com/app/uploads/viber-logo.png" alt="" style="width:22px;height:22px;display:block"><span>Viber</span></a>
      <a href="https://wa.me/359897853219" style="display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:#1A1A17;text-decoration:none"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" style="width:22px;height:22px;display:block"><span>WhatsApp</span></a>
      <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
        <a href="https://cal.com/tihomir-paunov-9sigpg/безплатен-30-минутен-разговор" style="background:#F4C430;color:#1A1A17;font-weight:700;font-size:16px;padding:14px 20px;border-radius:4px;text-decoration:none;white-space:nowrap" style-hover="background:#E9B920">Запазете 30-минутен разговор</a>
      </sc-if>
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggle }}" style="background:transparent;border:1px solid #1A1A17;border-radius:4px;padding:9px 12px;font:600 15px 'Sofia Sans',sans-serif;color:#1A1A17;cursor:pointer">{{ menuLabel }}</button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-direction:column;padding:8px 20px 28px;gap:0;border-top:1px solid rgba(26,26,23,0.14)">
      <a href="Home.dc.html" style="font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1.15;color:#1A1A17;text-decoration:none">Начало</a>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1.15;color:#1A1A17;text-decoration:none">{{ l.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;projects&quot;,&quot;about&quot;,&quot;blog&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, open: false };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    document.documentElement.lang = 'bg';
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const d = this.state.w >= 1180;
    const cur = this.props.current;
    const L = [['Услуги','Services.dc.html','services'],['Проекти','Projects.dc.html','projects'],['За нас','About.dc.html','about'],['Контакт','Contact.dc.html','contact']];
    return {
      desktop: d, mobile: !d, menuOpen: !d && this.state.open,
      menuLabel: this.state.open ? 'Затвори' : 'Меню',
      toggle: () => this.setState(s => ({ open: !s.open })),
      links: L.map(([label, href, k]) => ({ label, href, line: k === cur ? '#1A1A17' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
