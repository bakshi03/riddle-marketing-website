<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<title>Riddle Marketing: всички страници</title>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@800&family=Sofia+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#D9D4C8;font-family:'Sofia Sans',sans-serif;color:#1A1A17}a{color:#1A1A17}a:hover{color:#1E2B24}</style>
</helmet>
<div lang="bg" style="padding:80px;display:flex;flex-direction:column;gap:96px">
  <sc-for list="{{ pages }}" as="p" hint-placeholder-count="8">
    <section style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;gap:24px;align-items:baseline">
        <h2 style="font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:56px;line-height:1;margin:0">{{ p.title }}</h2>
        <a href="{{ p.file }}" style="font-size:18px">Отворете страницата</a>
      </div>
      <div style="display:flex;gap:64px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:16px;font-weight:600">Десктоп, 1440</span><iframe src="{{ p.file }}" title="{{ p.title }} 1440" style="width:1440px;height:960px;border:0;background:#F3F0E9;box-shadow:0 1px 0 rgba(0,0,0,0.1)"></iframe></div>
        <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:16px;font-weight:600">Мобилен, 390</span><iframe src="{{ p.file }}" title="{{ p.title }} 390" style="width:390px;height:844px;border:0;background:#F3F0E9"></iframe></div>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { pages: [
      ['Начало','Home.dc.html'],['Услуги','Services.dc.html'],['Проекти','Projects.dc.html'],
      ['За нас','About.dc.html'],['Контакт','Contact.dc.html']
    ].map(([title, file]) => ({ title, file })) };
  }
}
</script>
</body>
</html>
